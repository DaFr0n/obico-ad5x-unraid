name: Extract uploaded package

on:
  push:
    paths:
      - "Obico-My-Version-upload.zip"
      - ".github/workflows/extract-upload.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract package into repository root
        run: |
          set -euo pipefail
          test -s Obico-My-Version-upload.zip
          mkdir -p /tmp/obico-package
          unzip -q Obico-My-Version-upload.zip -d /tmp/obico-package
          package_dir="/tmp/obico-package/Obico My Version"
          test -d "$package_dir"
          rsync -a "$package_dir/" ./
          rm Obico-My-Version-upload.zip

      - name: Commit extracted files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract Obico AD5X package into repository"
            git push
          fi
